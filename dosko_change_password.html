<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(주)도스코 · 개인 비밀번호 변경</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", "Segoe UI", sans-serif; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, #102a43 0%, #090e1a 60%, #050810 100%);
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: rgba(17, 24, 39, 0.96);
      border: 1px solid #1e293b;
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      padding: 30px 28px;
    }
    .user-pill {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #38bdf8;
      font-weight: 700;
      margin-bottom: 18px;
    }
    h1 { font-size: 19px; font-weight: 800; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #94a3b8; margin-bottom: 18px; line-height: 1.5; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; }
    input {
      width: 100%; background: #0b1120; border: 1px solid #334155; border-radius: 10px;
      padding: 11px 13px; font-size: 14px; color: #f8fafc; outline: none;
    }
    input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18); }
    .rules {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 11px 14px;
      margin-bottom: 16px;
      font-size: 12px;
      display: grid;
      gap: 4px;
    }
    .rule-item { color: #94a3b8; }
    .rule-item.ok { color: #34d399; font-weight: 700; }
    .rule-item.bad { color: #f87171; }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff; border: none; border-radius: 10px; padding: 12px;
      font-size: 15px; font-weight: 800; cursor: pointer;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-ghost {
      margin-top: 10px; width: 100%; background: transparent;
      border: 1px solid #334155; color: #94a3b8; border-radius: 10px;
      padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .alert {
      display: none; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px;
      background: rgba(127, 29, 29, 0.45); border: 1px solid #ef4444; color: #fecaca;
    }
    /* 현장 공용 패드용 가상 숫자 키패드 (Virtual Tenkey) */
    .tenkey-container {
      display: none;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #1f2937;
    }
    .tenkey-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .tenkey-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .tkey {
      background: #1f2937;
      border: 1px solid #374151;
      color: #f8fafc;
      font-size: 20px;
      font-weight: 800;
      padding: 14px 0;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: background 0.1s, transform 0.05s;
    }
    .tkey:active {
      background: #374151;
      transform: scale(0.96);
    }
    .tkey-action {
      font-size: 13px;
      background: #27272a;
      color: #cbd5e1;
    }
    .tkey-back {
      background: #7f1d1d;
      color: #fca5a5;
      border-color: #991b1b;
    }
    .active-target-hint {
      outline: 2px solid #f59e0b !important;
      background: #182234 !important;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>개인 비밀번호 설정 / 변경</h1>
    <p class="sub" id="subDesc">영문·숫자·특수문자 조합 8자 이상의 안전한 비밀번호로 변경해 주세요.</p>
    <div id="userPill" class="user-pill">세션 정보 확인 중...</div>
    <div id="errBox" class="alert"></div>

    <form id="pwForm" autocomplete="off">
      <div class="field">
        <label for="curPw">현재 비밀번호 (최초 로그인 시 발급받은 임시 비밀번호)</label>
        <input id="curPw" type="password" required autofocus onfocus="setActiveInput('curPw')">
      </div>
      <div class="field">
        <label for="newPw">새 비밀번호</label>
        <input id="newPw" type="password" required oninput="checkRules()" onfocus="setActiveInput('newPw')">
      </div>
      <div class="field">
        <label for="newPw2">새 비밀번호 확인</label>
        <input id="newPw2" type="password" required oninput="checkRules()" onfocus="setActiveInput('newPw2')">
      </div>

      <div id="ruleBadge" style="margin-bottom:10px; display:inline-block; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:800; background:#065f46; color:#a7f3d0;">
        현장 작업자 (4자리 숫자)
      </div>
      <div class="rules" id="rulesBox">
        <div class="rule-item" id="rLen">• 4자리 숫자</div>
        <div class="rule-item" id="rNoEmp">• 본인 사번 및 반복 4자리(1111) 미포함</div>
        <div class="rule-item" id="rMatch">• 새 비밀번호 확인 일치</div>
      </div>

      <!-- 현장 터치패드용 보안 숫자 키패드 -->
      <div id="tenkeyPad" class="tenkey-container">
        <div class="tenkey-title">
          <span>🛡️ 터치패드 보안 숫자 키패드</span>
          <button type="button" onclick="shuffleTenkey()" style="background:transparent; border:none; color:#38bdf8; font-size:11px; cursor:pointer; text-decoration:underline;">
            🔀 배열 섞기
          </button>
        </div>
        <div class="tenkey-grid" id="tenkeyGrid">
          <!-- Rendered by JS -->
        </div>
      </div>

      <button id="saveBtn" class="btn" type="submit">비밀번호 변경 완료 및 시스템 진입</button>
    </form>
    <button id="backBtn" class="btn-ghost" type="button" onclick="logoutAndLogin()">다른 사번으로 로그인(로그아웃)</button>
  </div>

  <script>
    let activeInputId = "curPw";

    function setActiveInput(id) {
      activeInputId = id;
      ['curPw', 'newPw', 'newPw2'].forEach(i => {
        const el = document.getElementById(i);
        if (el) el.classList.remove('active-target-hint');
      });
      const target = document.getElementById(id);
      if (target) target.classList.add('active-target-hint');
    }

    function renderTenkey(shuffle = false) {
      let nums = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0];
      if (shuffle) nums.sort(() => Math.random() - 0.5);
      const grid = document.getElementById("tenkeyGrid");
      grid.innerHTML = nums.slice(0, 9).map(n => 
        `<button type="button" class="tkey" onclick="appendKey('${n}')">${n}</button>`
      ).join('') + 
      `<button type="button" class="tkey tkey-action" onclick="clearActiveInput()">전체삭제</button>` +
      `<button type="button" class="tkey" onclick="appendKey('${nums[9]}')">${nums[9]}</button>` +
      `<button type="button" class="tkey tkey-back" onclick="backspaceKey()">⌫</button>`;
    }

    function shuffleTenkey() { renderTenkey(true); }

    function appendKey(val) {
      const target = document.getElementById(activeInputId);
      if (!target) return;
      const rule = curUser?.pw_rule_type || (curUser?.role_code === 'PROD_OP' ? 'WORKER_4DIGIT' : 'OFFICE_COMPLEX');
      const maxLen = 6;
      if (target.value.length < maxLen) {
        target.value += val;
        checkRules();
      }
      if (activeInputId === "curPw" && target.value.length === maxLen && rule === "WORKER_4DIGIT") {
        setActiveInput("newPw");
      } else if (activeInputId === "newPw" && target.value.length === maxLen && rule === "WORKER_4DIGIT") {
        setActiveInput("newPw2");
      }
    }

    function backspaceKey() {
      const target = document.getElementById(activeInputId);
      if (target && target.value.length > 0) {
        target.value = target.value.slice(0, -1);
        checkRules();
      }
    }

    function clearActiveInput() {
      const target = document.getElementById(activeInputId);
      if (target) {
        target.value = "";
        checkRules();
      }
    }

    let curUser = null;
    let csrfToken = sessionStorage.getItem("dosko_csrf_token") || "";

    async function loadMe() {
      const res = await fetch("/api/auth/me", { credentials: "include", cache: "no-store" });
      if (!res.ok) { window.location.replace("/login"); return; }
      const data = await res.json();
      if (!data.authenticated || !data.user) { window.location.replace("/login"); return; }
      curUser = data.user;
      if (data.csrf_token) csrfToken = data.csrf_token;
      document.getElementById("userPill").textContent =
        `👤 [${curUser.emp_no}] ${curUser.display_name} | ${curUser.dept_path || '-'} (${curUser.job_title || '-'}) | ${curUser.role_label}`;
      
      const rBadge = document.getElementById("ruleBadge");
      const rBox = document.getElementById("rulesBox");
      const inp1 = document.getElementById("newPw");
      const inp2 = document.getElementById("newPw2");
      const rule = curUser.pw_rule_type || (curUser.role_code === 'PROD_OP' ? 'WORKER_4DIGIT' : 'OFFICE_COMPLEX');

      const tenkey = document.getElementById("tenkeyPad");
      if (rule === "WORKER_4DIGIT") {
        rBadge.textContent = "현장 작업자 (4자리 숫자)";
        rBadge.style.background = "#065f46"; rBadge.style.color = "#a7f3d0";
        rBox.innerHTML = `
          <div class="rule-item" id="rLen">• 숫자 정확히 4자리</div>
          <div class="rule-item" id="rNoEmp">• 본인 사번 및 반복(1111) 불가</div>
          <div class="rule-item" id="rMatch">• 새 비밀번호 확인 일치</div>
        `;
        inp1.type = "password"; inp1.maxLength = 6; inp1.placeholder = "●●●●●● (6자리 숫자)";
        inp2.type = "password"; inp2.maxLength = 6; inp2.placeholder = "●●●●●● (숫자 재입력)";
        if (tenkey) { tenkey.style.display = "block"; renderTenkey(false); }
      } else if (rule === "PROD_MGR_8DIGIT") {
        rBadge.textContent = "현장 관리책임자 (4~8자리 숫자)";
        rBadge.style.background = "#0369a1"; rBadge.style.color = "#bae6fd";
        rBox.innerHTML = `
          <div class="rule-item" id="rLen">• 숫자 4자리 ~ 8자리</div>
          <div class="rule-item" id="rNoEmp">• 본인 사번 및 반복 숫자 불가</div>
          <div class="rule-item" id="rMatch">• 새 비밀번호 확인 일치</div>
        `;
        inp1.type = "password"; inp1.maxLength = 8; inp1.placeholder = "4~8자리 숫자";
        inp2.type = "password"; inp2.maxLength = 8; inp2.placeholder = "숫자 재입력";
        if (tenkey) { tenkey.style.display = "block"; renderTenkey(false); }
      } else {
        rBadge.textContent = "사무직/임원 (8자리 이상 2종 조합)";
        rBadge.style.background = "#581c87"; rBadge.style.color = "#f3e8ff";
        rBox.innerHTML = `
          <div class="rule-item" id="rLen">• 8자 이상</div>
          <div class="rule-item" id="rComplex">• 영문, 숫자, 특수문자 중 2종 이상 조합</div>
          <div class="rule-item" id="rNoEmp">• 본인 사번/아이디 미포함</div>
          <div class="rule-item" id="rMatch">• 새 비밀번호 확인 일치</div>
        `;
        inp1.type = "password"; inp1.removeAttribute("maxLength"); inp1.placeholder = "8자리 이상 조합";
        inp2.type = "password"; inp2.removeAttribute("maxLength"); inp2.placeholder = "새 비밀번호 재입력";
        if (tenkey) { tenkey.style.display = "none"; }
      }
      setActiveInput("curPw");

      if (curUser.must_change_pw) {
        document.getElementById("subDesc").innerHTML =
          "<strong style='color:#fbbf24'>초기 비밀번호 상태입니다.</strong> 계속 진행하시려면 직군 규칙에 맞는 개인 비밀번호를 생성해 주세요.";
      }
    }

    function markRule(id, ok) {
      const el = document.getElementById(id);
      if (!el) return ok;
      el.className = "rule-item " + (ok ? "ok" : "bad");
      el.textContent = (ok ? "✓ " : "• ") + el.textContent.replace(/^[✓•]\s*/, "");
      return ok;
    }

    function checkRules() {
      const p1 = document.getElementById("newPw").value;
      const p2 = document.getElementById("newPw2").value;
      const eno = (curUser?.emp_no || "").toLowerCase();
      const gw = (curUser?.gw_login_id || "").toLowerCase();
      const lp = p1.toLowerCase();
      const noEmp = !/\s/.test(p1) && (!eno || !lp.includes(eno)) && (!gw || gw.length < 3 || !lp.includes(gw));
      const rule = curUser?.pw_rule_type || (curUser?.role_code === 'PROD_OP' ? 'WORKER_4DIGIT' : 'OFFICE_COMPLEX');

      if (rule === "WORKER_4DIGIT") {
        const c1 = markRule("rLen", /^\d{6}$/.test(p1));
        const c2 = markRule("rNoEmp", p1.length === 4 && noEmp && !/^(.){3}$/.test(p1));
        const c3 = markRule("rMatch", p1.length > 0 && p1 === p2);
        return c1 && c2 && c3;
      } else if (rule === "PROD_MGR_8DIGIT") {
        const c1 = markRule("rLen", /^\d{4,8}$/.test(p1));
        const c2 = markRule("rNoEmp", p1.length >= 4 && noEmp && !/^(.)+$/.test(p1));
        const c3 = markRule("rMatch", p1.length > 0 && p1 === p2);
        return c1 && c2 && c3;
      } else {
        const c1 = markRule("rLen", p1.length >= 8);
        let cats = 0;
        if (/[A-Za-z]/.test(p1)) cats++;
        if (/[0-9]/.test(p1)) cats++;
        if (/[^A-Za-z0-9\s]/.test(p1)) cats++;
        const c2 = markRule("rComplex", cats >= 2);
        const c3 = markRule("rNoEmp", p1.length > 0 && noEmp);
        const c4 = markRule("rMatch", p1.length > 0 && p1 === p2);
        return c1 && c2 && c3 && c4;
      }
    }

    async function logoutAndLogin() {
      await fetch("/api/auth/logout", {
        method: "POST", credentials: "include",
        headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken },
        body: "{}"
      }).catch(() => {});
      window.location.replace("/login");
    }

    document.getElementById("pwForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("errBox");
      errBox.style.display = "none";
      if (!checkRules()) {
        errBox.textContent = "비밀번호 생성 규칙을 모두 충족해야 합니다.";
        errBox.style.display = "block";
        return;
      }
      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      try {
        const res = await fetch("/api/auth/change-password", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken },
          body: JSON.stringify({
            current_password: document.getElementById("curPw").value,
            new_password: document.getElementById("newPw").value
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.status !== "ok") {
          errBox.textContent = data.message || data.error || "비밀번호 변경에 실패했습니다.";
          errBox.style.display = "block";
          return;
        }
        window.location.replace(curUser?.default_home || "/");
      } catch (err) {
        errBox.textContent = "서버 통신 오류: " + err.message;
        errBox.style.display = "block";
      } finally {
        btn.disabled = false;
      }
    });

    loadMe();
  </script>
</body>
</html>
